name: Generar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Dependencias
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Pruebas unitarias
        run: npm test

      - name: Preparar Android
        run: npm run android:prepare
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Compilar APK (debug, firmado con el keystore fijo)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Compras-${{ github.run_number }}.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Compras-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
